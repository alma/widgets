name: CI

on:
  push:
    branches: [ master, feature/lit-migration ]
  pull_request:
    branches: [ master, feature/lit-migration ]

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch the latest commit, only
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run test:harness

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch the latest commit, only
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - name: Install Chromium for the browser tests
        run: npm run test:browser:install -- --with-deps
      - run: npm run test

  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch the latest commit, only
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run check:es2021
      # attw passes even when index.d.ts imports an unresolved @/ path, so only this step catches it.
      - name: Check the declaration files
        run: |
          test -f dist/types/index.d.ts
          # Leftover files mean the roll-up failed, and they would ship in the tarball.
          extra=$(find dist/types -type f ! -path dist/types/index.d.ts)
          if [ -n "$extra" ]; then
            echo "dist/types must hold index.d.ts only:"
            echo "$extra"
            exit 1
          fi
          # The package has no dependencies, so any import would leave consumers with an unresolved type.
          if grep -nE "^\s*import\b|\bimport\(|^\s*export\b[^;]*\bfrom\b|<reference" dist/types/index.d.ts; then
            echo "dist/types/index.d.ts must not import or reference another file."
            exit 1
          fi
      # lint:package skips attw's unexpected-module-syntax rule. Without "type": "module" or an
      # exports field, node16 reads widgets.js, the ESM build, as CommonJS. Both wait for 5.0.
      - run: npm run lint:package

  storybook:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch the latest commit, only
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      # Fails when a story doesn't build. The a11y panel and visual checks block nothing.
      - run: npm run build-storybook -- --test

  contract:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The reference build needs the commit in scripts/ref-sha.txt
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - run: npm run build:ref
      - run: npm run test:contract:ref
      - run: npm run fixtures:messages -- --check
      - run: npm run build:contract
      - run: npm run test:contract

  update-release-draft:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-26.04
    steps:
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          name: ${{ env.BUILD_VERSION }}
          tag: ${{ env.BUILD_VERSION }}
          version: ${{ env.BUILD_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
