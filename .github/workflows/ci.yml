name: CI

on:
  push:
    branches: [ master, feature/lit-migration, feature/rebranding ]
  pull_request:
    branches: [ master, feature/lit-migration, feature/rebranding ]

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch the latest commit, only
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch the latest commit, only
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - name: Install Chromium for the browser tests
        run: npm run test:browser:install -- --with-deps
      - run: npm run test

  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch the latest commit, only
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      # Lit reads globalThis, which every browser from the documented floor has.
      - run: npm run check:es2019
      # attw and publint pass even when index.d.ts imports another file.
      # The package has no dependencies, so any import leaves consumers with an unresolved type.
      - name: Check that dist/types/index.d.ts is self-contained
        run: |
          if grep -nE "^\s*import\b|\bimport\(|\bfrom\s*['\"]|<reference" dist/types/index.d.ts; then
            echo "dist/types/index.d.ts must not import or reference another file."
            exit 1
          fi
      - run: npm run lint:package

  storybook:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch the latest commit, only
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      # Fails when a story doesn't build. The a11y panel and visual checks block nothing.
      - run: npm run build-storybook -- --test

  contract:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The reference build needs the commit in scripts/ref-sha.txt
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - run: npm run build:ref
      - run: npm run test:contract:ref
      - run: npm run fixtures:messages -- --check
      - run: npm run build:contract
      - run: npm run test:contract

  consumers:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch the latest commit, only
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - name: Install Chromium for the render check
        run: npm run test:browser:install -- --with-deps
      - run: npm run build
      - run: npm run test:consumers

  update-release-draft:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-26.04
    steps:
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          name: ${{ env.BUILD_VERSION }}
          tag: ${{ env.BUILD_VERSION }}
          version: ${{ env.BUILD_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
