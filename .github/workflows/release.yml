# This action handles the automatic publishing of new releases
name: Release

on:
  release:
    types:
      - published

jobs:
  publish-package:
    name: Publish package
    runs-on: ubuntu-26.04

    permissions:
      contents: write  # checkout repository, write release assets
      id-token: write  # npm authentication

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE_VERSION: ${{ contains(github.event.release.tag_name, '-') }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          # semver.org's regex without build metadata: npm drops a `+build` part,
          # so `v4.8.0+build-1` would publish 4.8.0, a stable version, under the beta tag.
          N='(0|[1-9][0-9]*)'
          ID='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          TAG_PATTERN="^v$N\.$N\.$N(-$ID(\.$ID)*)?\$"
          if [[ ! "$TAG" =~ $TAG_PATTERN ]]; then
            echo "::error::$TAG isn't a version tag such as v4.8.0 or v4.8.0-beta.0."
            exit 1
          fi

          # Semver ranges like 4.x skip a version only when it has a '-', so the box alone protects nobody.
          if [ "$IS_PRERELEASE_VERSION" != "$PRERELEASE" ]; then
            echo "::error::$TAG needs 'Set as a pre-release' ticked when the version has a '-', and unticked otherwise."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
        # We do not create a commit with the update package version
        # Therefore the package.*.json in the repository will always have out-of-sync versions

      - name: Set version in code (update package.json)
        run: npm --no-git-tag-version version ${{ github.event.release.tag_name }}

      - name: Build library
        run: npm run build
        env:
          BUILD_VERSION: ${{ github.event.release.tag_name }}

      - name: Determine npm dist-tag
        id: npm-tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # Git tags carry a `v`, npm versions don't.
          VERSION="${TAG#v}"
          MAJOR="${VERSION%%.*}"

          # A prerelease version must not move `latest`, which `npm install` and the CDN's bare URL resolve to.
          # Naming the tag after the major keeps a V4 beta from replacing a V5 one.
          if [[ "$VERSION" == *-* ]]; then
            echo "tag=v${MAJOR}-beta" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A stable release from an older support branch (e.g. 4.x after 5.0.0 shipped) must not
          # move `latest` backwards either, so compare against what `latest` currently points to.
          # No fallback: if the registry can't be read, fail rather than risk moving `latest` backwards.
          CURRENT_LATEST=$(npm view @alma/widgets dist-tags.latest)
          HIGHEST=$(printf '%s\n%s\n' "$CURRENT_LATEST" "$VERSION" | sort -V | tail -n1)
          if [ "$HIGHEST" = "$VERSION" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${MAJOR}-lts" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish library
        env:
          NPM_TAG: ${{ steps.npm-tag.outputs.tag }}
        run: |
          # Clean up some fields in package.json, then publish
          npm pkg delete scripts devDependencies eslintConfig lint-staged commitlint config prettier
          npm publish --provenance --tag "$NPM_TAG"

      - name: Publish build assets to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            ./dist/widgets.umd.js
            ./dist/widgets.js
            ./dist/widgets.css
            ./dist/widgets.min.css
            ./dist/widgets-wc.umd.js

  # Send changelog to Slack
  slack-notification:
    name: Publish changelog to Slack
    needs: publish-package
    if: ${{ !contains(github.event.release.tag_name, '-') }}
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get release notes
        id: release-notes
        run: |
            # Retrieve the release notes from the repository itself to prevent release notes from being truncated
            # cf. https://github.community/t/set-output-truncates-multiline-strings/16852
            RELEASE_NOTES="$(cat $GITHUB_EVENT_PATH | jq -r .release.body)"
            RELEASE_NOTES="${RELEASE_NOTES//'%'/'%25'}"
            RELEASE_NOTES="${RELEASE_NOTES//$'\n'/'%0A'}"
            RELEASE_NOTES="${RELEASE_NOTES//$'\r'/'%0D'}"

            # Add URLs to GitHub pull requests
            PULL_REQUEST_URL_START=${{ github.event.repository.html_url }}/pull/
            ESCAPED_PULL_REQUEST_URL_START=$(printf '%s\n' "$PULL_REQUEST_URL_START" | sed -e 's/[\/&]/\\&/g')
            RELEASE_NOTES=$(echo $RELEASE_NOTES | sed -E "s/#([0-9]+)/[#\1](${ESCAPED_PULL_REQUEST_URL_START}\1)/g")

            # Add URLs to GitHub profiles
            PROFILE_URL_START=${{ github.server_url }}/
            ESCAPED_PROFILE_URL_START=$(printf '%s\n' "$PROFILE_URL_START" | sed -e 's/[\/&]/\\&/g')
            RELEASE_NOTES=$(echo $RELEASE_NOTES | sed -E "s/@([[:alnum:]-]+)/[@\1](${ESCAPED_PROFILE_URL_START}\1)/g")
            echo ::set-output name=RELEASE_NOTES::"$RELEASE_NOTES"

      - name: Use Slack markdown
        uses: LoveToKnow/slackify-markdown-action@698a1d4d0ff1794152a93c03ee8ca5e03a310d4e # v1.1.1
        id: slack-markdown-release-notes
        with:
          text: |

            New release of `alma/widgets` published, **[${{ github.event.release.name }}](${{
              github.event.release.html_url }})**:

            ${{ steps.release-notes.outputs.RELEASE_NOTES }}

      - name: Send changelog to Slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_RELEASE_CHANGELOG_BOT_TOKEN }}
          payload: |
            channel: CR9C57YM6 # alma_changelog
            text: ${{ toJson(steps.slack-markdown-release-notes.outputs.text) }}
            username: "${{ github.event.sender.login }}"
            icon_url: "${{ github.event.sender.avatar_url }}"
